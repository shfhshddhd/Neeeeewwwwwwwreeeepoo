name: Telegram Userbot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            aiohttp==3.11.11 \
            beautifulsoup4==4.12.3 \
            edge-tts==7.2.8 \
            GitPython==3.1.44 \
            google-generativeai==0.8.6 \
            lxml==6.1.2 \
            motor==3.6.0 \
            openai==2.28.0 \
            pillow==11.1.0 \
            psutil==7.2.2 \
            py-tgcalls==2.3.3 \
            pyfiglet==1.0.2 \
            pymongo==4.9.2 \
            python-dotenv==1.0.1 \
            python-telegram-bot==21.10 \
            replit==4.1.2 \
            requests==2.32.3 \
            rich==13.9.3 \
            speedtest-cli==2.1.3 \
            Telethon==1.44.0 \
            yt-dlp==2026.8.19

      - name: Download Cloudflare
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

      - name: Start Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINI_APP_PUBLIC_PATH: /mini-app/
        shell: bash
        run: |
          set -euo pipefail

          start_tunnel() {
            rm -f cloudflared.log

            nohup ./cloudflared tunnel \
              --url http://127.0.0.1:8008 \
              > cloudflared.log 2>&1 &

            CLOUDFLARED_PID=$!

            for i in {1..30}; do
              TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)

              if [ -n "$TUNNEL_URL" ]; then
                echo "New Tunnel URL: $TUNNEL_URL"
                return 0
              fi

              if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
                echo "Cloudflare tunnel process exited."
                cat cloudflared.log
                return 1
              fi

              sleep 2
            done

            echo "Could not get a new Cloudflare Tunnel URL."
            cat cloudflared.log
            return 1
          }

          start_bot() {
            echo "Starting Telegram Bot with:"
            echo "MINI_APP_URL=$TUNNEL_URL"

            MINI_APP_URL="$TUNNEL_URL" \
            PYTHONPATH="$GITHUB_WORKSPACE/telegram_userbot" \
            python -m telegram_userbot.main &

            BOT_PID=$!

            for i in {1..30}; do
              if curl -fsS --max-time 5 \
                http://127.0.0.1:8008/mini-app/ > /dev/null; then
                echo "Mini App is running."
                return 0
              fi

              if ! kill -0 "$BOT_PID" 2>/dev/null; then
                echo "Bot process exited."
                wait "$BOT_PID"
                return 1
              fi

              sleep 2
            done

            echo "Mini App did not become ready."
            return 1
          }

          if ! start_tunnel; then
            exit 1
          fi

          if ! start_bot; then
            exit 1
          fi

          echo "Telegram Bot + Mini App + Watchdog are running."

          while true; do
            sleep 60

            echo "Watchdog: checking Mini App and Cloudflare Tunnel..."

            if curl -fsS --max-time 15 \
              "$TUNNEL_URL/mini-app/" > /dev/null; then
              echo "Watchdog: Mini App is healthy."
              continue
            fi

            echo "Watchdog: Tunnel is DOWN. Creating a new tunnel..."

            kill "$CLOUDFLARED_PID" 2>/dev/null || true
            wait "$CLOUDFLARED_PID" 2>/dev/null || true

            if ! start_tunnel; then
              echo "Watchdog: failed to create new tunnel."
              continue
            fi

            echo "Watchdog: restarting bot with new Mini App URL..."

            kill "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true

            sleep 3

            if ! start_bot; then
              echo "Watchdog: bot restart failed."
              exit 1
            fi

            echo "Watchdog: recovery successful."
          done
